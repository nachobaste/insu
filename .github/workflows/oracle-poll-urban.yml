name: Oracle Poll (urban corridors)

# Hobby-plan Vercel crons only run once per day, which can't service the
# intraday CDMX commute windows. This workflow polls the corridor oracle every
# 15 min during those windows instead. (Weather/fuel stay on Vercel's daily cron.)

on:
  schedule:
    # UTC. Mexico City is permanently UTC-6 (no DST).
    # Morning window MX 07:00-10:00 -> UTC 13:00-15:59
    # Evening window MX 17:00-20:00 -> UTC 23:00-01:59
    - cron: '*/15 13-15,23,0-1 * * *'
  workflow_dispatch: {} # allow manual runs for testing

jobs:
  poll:
    name: Trigger urban oracle poll
    runs-on: ubuntu-latest
    steps:
      - name: Poll /api/oracle-poll?types=urban
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://insu-theta.vercel.app/api/oracle-poll?types=urban")
          echo "HTTP ${code}"
          cat /tmp/body
          echo
          test "${code}" = "200"
