name: Oracle Poll (air quality)

# Scheduled polling moved to cron-job.org (hourly during CDMX daytime,
# UTC 14:00–03:00) — GH Actions schedules are throttled, producing multi-hour
# gaps. This workflow is kept for manual/on-demand runs only.
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll /api/oracle-poll?types=air_quality
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://insu-theta.vercel.app/api/oracle-poll?types=air_quality")
          echo "HTTP ${code}"; cat /tmp/body; echo
          test "${code}" = "200"
