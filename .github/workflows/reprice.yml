name: Reprice (manual)

# On-demand reprice trigger. Vercel already runs /api/reprice daily (00:00 UTC);
# this lets us force a reprice immediately (e.g. after a fresh oracle reading or
# a capital change) without waiting for the daily cron.

on:
  workflow_dispatch: {}

jobs:
  reprice:
    name: Trigger reprice
    runs-on: ubuntu-latest
    steps:
      - name: Poll /api/reprice
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://insu-theta.vercel.app/api/reprice")
          echo "HTTP ${code}"
          cat /tmp/body
          echo
          test "${code}" = "200"
